<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16">
        <animate attributeName="stop-color" values="#090d16;#0d1527;#13102b;#090d16" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#172554;#0f2942;#1e1b4b" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#a855f7;#38bdf8;#60a5fa" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#818cf8;#c084fc" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#60a5fa;#c084fc;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="glow-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 50px; font-weight: 800; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 500; fill: #94a3b8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }
    .stat-title { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #38bdf8; letter-spacing: 1px; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="400" rx="16" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="200" cy="120" r="180" fill="url(#glow-orb)">
    <animate attributeName="r" values="160;200;160" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="280" r="220" fill="url(#glow-orb)">
    <animate attributeName="r" values="200;240;200" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Decorative Circuit lines -->
  <path d="M 50 200 Q 300 150 600 200 T 1150 200" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="6,6" stroke-opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;100" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Top Category Tag -->
  <g transform="translate(600, 70)">
    <rect x="-155" y="-16" width="310" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="0" y="5" text-anchor="middle" class="stat-title">🎯 REVENUE &amp; SALES ENABLEMENT</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" class="title" fill="url(#title-grad)" filter="url(#glow)">Awesome Sales Enablement</text>
  <text x="600" y="185" text-anchor="middle" class="subtitle">Curated SaaS Platforms, Enterprise Architectures &amp; Open-Source Repos</text>

  <!-- Feature Pills -->
  <g transform="translate(180, 250)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="-55" cy="0" r="5" fill="#a855f7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="5" y="5" text-anchor="middle" class="pill-text">📚 Content Hubs</text>
  </g>

  <g transform="translate(390, 250)">
    <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="-65" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="5" y="5" text-anchor="middle" class="pill-text">🎓 Sales Readiness</text>
  </g>

  <g transform="translate(605, 250)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="-60" cy="0" r="5" fill="#e879f9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="5" y="5" text-anchor="middle" class="pill-text">🤖 AI Coaching</text>
  </g>

  <g transform="translate(815, 250)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#0f2942" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle cx="-60" cy="0" r="5" fill="#34d399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="5" y="5" text-anchor="middle" class="pill-text">🧭 Guided Selling</text>
  </g>

  <g transform="translate(1020, 250)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1f2937" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="-55" cy="0" r="5" fill="#f59e0b">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="5" y="5" text-anchor="middle" class="pill-text">⚡ Open Source</text>
  </g>

  <!-- Footer Indicator -->
  <g transform="translate(600, 340)">
    <rect x="-240" y="-14" width="480" height="28" rx="14" fill="#0b0f19" stroke="#334155" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">
      ✨ Production-Ready Playbooks • Governance • Analytics • LMS
    </text>
  </g>
</svg>